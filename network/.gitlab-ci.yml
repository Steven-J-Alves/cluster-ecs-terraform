# Apply order: network → cluster → apps
# Network is prod-only (shared VPC). Only runs on main branch.

variables:
  TF_IMAGE: "hashicorp/terraform:1.9"
  NETWORK_HOST_DIR: "$CI_PROJECT_DIR/network"
  NETWORK_TF_WORKDIR: "/workspace/environments/prod"

stages:
  - validate
  - plan
  - apply
  - destroy

# ── Job templates (hidden) ────────────────────────────────────────────────────

.network_validate:
  stage: validate
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$NETWORK_HOST_DIR:/workspace" -w $NETWORK_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE init -input=false -reconfigure
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$NETWORK_HOST_DIR:/workspace" -w $NETWORK_TF_WORKDIR
        $TF_IMAGE validate

.network_plan:
  stage: plan
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$NETWORK_HOST_DIR:/workspace" -w $NETWORK_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE init -input=false -reconfigure
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$NETWORK_HOST_DIR:/workspace" -w $NETWORK_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE plan -input=false -out=tfplan

.network_apply:
  stage: apply
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$NETWORK_HOST_DIR:/workspace" -w $NETWORK_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE init -input=false -reconfigure
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$NETWORK_HOST_DIR:/workspace" -w $NETWORK_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE apply -input=false -auto-approve
  when: manual
  allow_failure: false

.network_destroy:
  stage: destroy
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$NETWORK_HOST_DIR:/workspace" -w $NETWORK_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE init -input=false -reconfigure
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$NETWORK_HOST_DIR:/workspace" -w $NETWORK_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE destroy -input=false -auto-approve
  when: manual

# ── PROD — main branch only ───────────────────────────────────────────────────

network:validate:
  extends: .network_validate
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - network/**/*

network:plan:
  extends: .network_plan
  artifacts:
    paths:
      - network/environments/prod/tfplan
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - network/**/*
  needs:
    - network:validate

network:apply:
  extends: .network_apply
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - network/**/*
  needs:
    - network:plan

network:destroy:
  extends: .network_destroy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - network/**/*
