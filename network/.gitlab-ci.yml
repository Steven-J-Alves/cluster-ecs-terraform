variables:
  TF_IMAGE: "hashicorp/terraform:1.9"
  # Mount the entire network/ dir so relative module paths resolve correctly
  NETWORK_HOST_DIR: "$CI_PROJECT_DIR/network"
  NETWORK_TF_WORKDIR: "/workspace/vpc_main"

stages:
  - validate
  - plan
  - apply
  - destroy

# Macro: docker run com user do runner para evitar ficheiros root-owned
.tf_run: &tf_run >-
  docker run --rm
  --user "$(id -u):$(id -g)"
  -v "$NETWORK_HOST_DIR:/workspace"
  -w $NETWORK_TF_WORKDIR
  -e AWS_ACCESS_KEY_ID
  -e AWS_SECRET_ACCESS_KEY
  -e AWS_DEFAULT_REGION
  $TF_IMAGE

# ------- VALIDATE -------
network:validate:
  stage: validate
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$NETWORK_HOST_DIR:/workspace" -w $NETWORK_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE init -input=false -reconfigure
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$NETWORK_HOST_DIR:/workspace" -w $NETWORK_TF_WORKDIR
        $TF_IMAGE validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - network/**/*

# ------- PLAN -------
network:plan:
  stage: plan
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$NETWORK_HOST_DIR:/workspace" -w $NETWORK_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE init -input=false -reconfigure
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$NETWORK_HOST_DIR:/workspace" -w $NETWORK_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE plan -input=false -out=tfplan
  artifacts:
    paths:
      - network/vpc_main/tfplan
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - network/**/*
  needs:
    - network:validate

# ------- APPLY -------
network:apply:
  stage: apply
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$NETWORK_HOST_DIR:/workspace" -w $NETWORK_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE init -input=false -reconfigure
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$NETWORK_HOST_DIR:/workspace" -w $NETWORK_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE apply -input=false -auto-approve
  when: manual
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - network/**/*
  needs:
    - network:plan

# ------- DESTROY -------
network:destroy:
  stage: destroy
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$NETWORK_HOST_DIR:/workspace" -w $NETWORK_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE init -input=false -reconfigure
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$NETWORK_HOST_DIR:/workspace" -w $NETWORK_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE destroy -input=false -auto-approve
  when: manual
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - network/**/*
