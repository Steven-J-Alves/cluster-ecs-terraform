# Apply order: network → cluster → apps
# Network is prod-only (shared VPC). Only runs on main branch.

stages:
  - validate
  - plan
  - apply
  - destroy

# ── Job templates (hidden) ────────────────────────────────────────────────────

.network_validate:
  image: hashicorp/terraform:1.9
  stage: validate
  script:
    - terraform -chdir=$NETWORK_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$NETWORK_TF_WORKDIR validate

.network_plan:
  image: hashicorp/terraform:1.9
  stage: plan
  script:
    - terraform -chdir=$NETWORK_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$NETWORK_TF_WORKDIR plan -input=false -out=tfplan

.network_apply:
  image: hashicorp/terraform:1.9
  stage: apply
  script:
    - terraform -chdir=$NETWORK_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$NETWORK_TF_WORKDIR apply -input=false -auto-approve
  when: manual
  allow_failure: false

.network_destroy:
  image: hashicorp/terraform:1.9
  stage: destroy
  script:
    - terraform -chdir=$NETWORK_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$NETWORK_TF_WORKDIR destroy -input=false -auto-approve
  when: manual

# ── PROD — main branch only ───────────────────────────────────────────────────

network:validate:
  extends: .network_validate
  variables:
    NETWORK_TF_WORKDIR: "network/environments/prod"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - network/**/*

network:plan:
  extends: .network_plan
  variables:
    NETWORK_TF_WORKDIR: "network/environments/prod"
  artifacts:
    paths:
      - network/environments/prod/tfplan
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - network/**/*
  needs:
    - network:validate

network:apply:
  extends: .network_apply
  variables:
    NETWORK_TF_WORKDIR: "network/environments/prod"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - network/**/*
  needs:
    - network:plan

network:destroy:
  extends: .network_destroy
  variables:
    NETWORK_TF_WORKDIR: "network/environments/prod"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - network/**/*
