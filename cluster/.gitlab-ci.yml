# Apply order: network → cluster → apps
# This pipeline requires network state to exist (run network:apply first).
# The validate job checks for this automatically.

variables:
  TF_IMAGE: "hashicorp/terraform:1.9"
  # Mount the entire repo so relative module paths to root modules/ resolve correctly
  CLUSTER_HOST_DIR: "$CI_PROJECT_DIR"
  CLUSTER_TF_WORKDIR: "/workspace/cluster/environments/prod"

stages:
  - validate
  - plan
  - apply
  - destroy

# ------- VALIDATE -------
cluster:validate:
  stage: validate
  script:
    - echo "Checking network state exists in S3..."
    - aws s3 ls "s3://kriolu-kloud-terraform-tfstates/network-terraform/prod/" --region us-east-1 > /dev/null 2>&1 ||
        (echo "ERROR: Network state not found. Run network:apply first." && exit 1)
    - echo "Network state found — OK"
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$CLUSTER_HOST_DIR:/workspace" -w $CLUSTER_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE init -input=false -reconfigure
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$CLUSTER_HOST_DIR:/workspace" -w $CLUSTER_TF_WORKDIR
        $TF_IMAGE validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - cluster/**/*

# ------- PLAN -------
cluster:plan:
  stage: plan
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$CLUSTER_HOST_DIR:/workspace" -w $CLUSTER_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE init -input=false -reconfigure
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$CLUSTER_HOST_DIR:/workspace" -w $CLUSTER_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE plan -input=false -out=tfplan
  artifacts:
    paths:
      - cluster/environments/prod/tfplan
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - cluster/**/*
  needs:
    - cluster:validate

# ------- APPLY -------
cluster:apply:
  stage: apply
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$CLUSTER_HOST_DIR:/workspace" -w $CLUSTER_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE init -input=false -reconfigure
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$CLUSTER_HOST_DIR:/workspace" -w $CLUSTER_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE apply -input=false -auto-approve
  when: manual
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - cluster/**/*
  needs:
    - cluster:plan

# ------- DESTROY -------
cluster:destroy:
  stage: destroy
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$CLUSTER_HOST_DIR:/workspace" -w $CLUSTER_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE init -input=false -reconfigure
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$CLUSTER_HOST_DIR:/workspace" -w $CLUSTER_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE destroy -input=false -auto-approve
  when: manual
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - cluster/**/*
# destroy prep
