# Apply order: network → cluster → apps
# Branches: main → prod | homolog → homolog
# Both environments share the same network stack (prod VPC).

stages:
  - validate
  - plan
  - apply
  - destroy

# ── Job templates (hidden) ────────────────────────────────────────────────────

.cluster_validate:
  image: hashicorp/terraform:1.9
  stage: validate
  before_script:
    - apk add --no-cache aws-cli
  script:
    - if ! aws s3 ls "s3://kriolu-kloud-terraform-tfstates/network-terraform/prod/" --region us-east-1 > /dev/null 2>&1; then echo "ERROR - Network state not found. Run network:apply first."; exit 1; fi
    - echo "Network state found — OK"
    - terraform -chdir=$CLUSTER_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$CLUSTER_TF_WORKDIR validate

.cluster_plan:
  image: hashicorp/terraform:1.9
  stage: plan
  script:
    - terraform -chdir=$CLUSTER_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$CLUSTER_TF_WORKDIR plan -input=false -out=tfplan

.cluster_apply:
  image: hashicorp/terraform:1.9
  stage: apply
  script:
    - terraform -chdir=$CLUSTER_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$CLUSTER_TF_WORKDIR apply -input=false -auto-approve
  when: manual
  allow_failure: false

.cluster_destroy:
  image: hashicorp/terraform:1.9
  stage: destroy
  script:
    - terraform -chdir=$CLUSTER_TF_WORKDIR init -input=false -reconfigure
    - terraform -chdir=$CLUSTER_TF_WORKDIR destroy -input=false -auto-approve
  when: manual

# ── PROD — main branch ────────────────────────────────────────────────────────

cluster:validate:
  extends: .cluster_validate
  variables:
    CLUSTER_TF_WORKDIR: "cluster/environments/prod"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - cluster/**/*
        - modules/**/*

cluster:plan:
  extends: .cluster_plan
  variables:
    CLUSTER_TF_WORKDIR: "cluster/environments/prod"
  artifacts:
    paths:
      - cluster/environments/prod/tfplan
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - cluster/**/*
        - modules/**/*
  needs:
    - cluster:validate

cluster:apply:
  extends: .cluster_apply
  variables:
    CLUSTER_TF_WORKDIR: "cluster/environments/prod"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - cluster/**/*
        - modules/**/*
  needs:
    - cluster:plan

cluster:destroy:
  extends: .cluster_destroy
  variables:
    CLUSTER_TF_WORKDIR: "cluster/environments/prod"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - cluster/**/*
        - modules/**/*

# ── HOMOLOG — homolog branch ──────────────────────────────────────────────────

cluster:homolog:validate:
  extends: .cluster_validate
  variables:
    CLUSTER_TF_WORKDIR: "cluster/environments/homolog"
  rules:
    - if: '$CI_COMMIT_BRANCH == "homolog" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - cluster/**/*
        - modules/**/*

cluster:homolog:plan:
  extends: .cluster_plan
  variables:
    CLUSTER_TF_WORKDIR: "cluster/environments/homolog"
  artifacts:
    paths:
      - cluster/environments/homolog/tfplan
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "homolog" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - cluster/**/*
        - modules/**/*
  needs:
    - cluster:homolog:validate

cluster:homolog:apply:
  extends: .cluster_apply
  variables:
    CLUSTER_TF_WORKDIR: "cluster/environments/homolog"
  rules:
    - if: '$CI_COMMIT_BRANCH == "homolog" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - cluster/**/*
        - modules/**/*
  needs:
    - cluster:homolog:plan

cluster:homolog:destroy:
  extends: .cluster_destroy
  variables:
    CLUSTER_TF_WORKDIR: "cluster/environments/homolog"
  rules:
    - if: '$CI_COMMIT_BRANCH == "homolog" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - cluster/**/*
        - modules/**/*
