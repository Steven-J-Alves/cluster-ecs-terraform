variables:
  TF_IMAGE: "hashicorp/terraform:1.9"
  # Mount the entire cluster/ dir so relative module paths (../../modules/...) resolve correctly
  CLUSTER_HOST_DIR: "$CI_PROJECT_DIR/cluster"
  TF_WORKDIR: "/workspace/ecs_cluster_main"

stages:
  - validate
  - plan
  - apply
  - destroy

# ------- VALIDATE -------
cluster:validate:
  stage: validate
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$CLUSTER_HOST_DIR:/workspace" -w $TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE init -input=false -reconfigure
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$CLUSTER_HOST_DIR:/workspace" -w $TF_WORKDIR
        $TF_IMAGE validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - cluster/**/*

# ------- PLAN -------
cluster:plan:
  stage: plan
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$CLUSTER_HOST_DIR:/workspace" -w $TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE init -input=false -reconfigure
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$CLUSTER_HOST_DIR:/workspace" -w $TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE plan -input=false -out=tfplan
  artifacts:
    paths:
      - cluster/ecs_cluster_main/tfplan
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - cluster/**/*
  needs:
    - cluster:validate

# ------- APPLY -------
cluster:apply:
  stage: apply
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$CLUSTER_HOST_DIR:/workspace" -w $TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE init -input=false -reconfigure
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$CLUSTER_HOST_DIR:/workspace" -w $TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE apply -input=false -auto-approve
  when: manual
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - cluster/**/*
  needs:
    - cluster:plan

# ------- DESTROY -------
cluster:destroy:
  stage: destroy
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$CLUSTER_HOST_DIR:/workspace" -w $TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE init -input=false -reconfigure
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$CLUSTER_HOST_DIR:/workspace" -w $TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE destroy -input=false -auto-approve
  when: manual
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - cluster/**/*
# destroy prep
