# Apply order: network → cluster → apps
# Branches: main → prod | homolog → homolog
# Both environments share the same network stack (prod VPC).

variables:
  TF_IMAGE: "hashicorp/terraform:1.9"
  CLUSTER_HOST_DIR: "$CI_PROJECT_DIR"

stages:
  - validate
  - plan
  - apply
  - destroy

# ── Job templates (hidden) ────────────────────────────────────────────────────

.cluster_validate:
  stage: validate
  script:
    - if ! aws s3 ls "s3://kriolu-kloud-terraform-tfstates/network-terraform/prod/" --region us-east-1 > /dev/null 2>&1; then echo "ERROR - Network state not found. Run network:apply first."; exit 1; fi
    - echo "Network state found — OK"
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$CLUSTER_HOST_DIR:/workspace" -w $CLUSTER_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE init -input=false -reconfigure
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$CLUSTER_HOST_DIR:/workspace" -w $CLUSTER_TF_WORKDIR
        $TF_IMAGE validate

.cluster_plan:
  stage: plan
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$CLUSTER_HOST_DIR:/workspace" -w $CLUSTER_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE init -input=false -reconfigure
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$CLUSTER_HOST_DIR:/workspace" -w $CLUSTER_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE plan -input=false -out=tfplan

.cluster_apply:
  stage: apply
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$CLUSTER_HOST_DIR:/workspace" -w $CLUSTER_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE init -input=false -reconfigure
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$CLUSTER_HOST_DIR:/workspace" -w $CLUSTER_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE apply -input=false -auto-approve
  when: manual
  allow_failure: false

.cluster_destroy:
  stage: destroy
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$CLUSTER_HOST_DIR:/workspace" -w $CLUSTER_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE init -input=false -reconfigure
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$CLUSTER_HOST_DIR:/workspace" -w $CLUSTER_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE destroy -input=false -auto-approve
  when: manual

# ── PROD — main branch ────────────────────────────────────────────────────────

cluster:validate:
  extends: .cluster_validate
  variables:
    CLUSTER_TF_WORKDIR: "/workspace/cluster/environments/prod"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - cluster/**/*
        - modules/**/*

cluster:plan:
  extends: .cluster_plan
  variables:
    CLUSTER_TF_WORKDIR: "/workspace/cluster/environments/prod"
  artifacts:
    paths:
      - cluster/environments/prod/tfplan
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - cluster/**/*
        - modules/**/*
  needs:
    - cluster:validate

cluster:apply:
  extends: .cluster_apply
  variables:
    CLUSTER_TF_WORKDIR: "/workspace/cluster/environments/prod"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - cluster/**/*
        - modules/**/*
  needs:
    - cluster:plan

cluster:destroy:
  extends: .cluster_destroy
  variables:
    CLUSTER_TF_WORKDIR: "/workspace/cluster/environments/prod"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - cluster/**/*
        - modules/**/*

# ── HOMOLOG — homolog branch ──────────────────────────────────────────────────

cluster:homolog:validate:
  extends: .cluster_validate
  variables:
    CLUSTER_TF_WORKDIR: "/workspace/cluster/environments/homolog"
  rules:
    - if: '$CI_COMMIT_BRANCH == "homolog" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - cluster/**/*
        - modules/**/*

cluster:homolog:plan:
  extends: .cluster_plan
  variables:
    CLUSTER_TF_WORKDIR: "/workspace/cluster/environments/homolog"
  artifacts:
    paths:
      - cluster/environments/homolog/tfplan
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "homolog" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - cluster/**/*
        - modules/**/*
  needs:
    - cluster:homolog:validate

cluster:homolog:apply:
  extends: .cluster_apply
  variables:
    CLUSTER_TF_WORKDIR: "/workspace/cluster/environments/homolog"
  rules:
    - if: '$CI_COMMIT_BRANCH == "homolog" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - cluster/**/*
        - modules/**/*
  needs:
    - cluster:homolog:plan

cluster:homolog:destroy:
  extends: .cluster_destroy
  variables:
    CLUSTER_TF_WORKDIR: "/workspace/cluster/environments/homolog"
  rules:
    - if: '$CI_COMMIT_BRANCH == "homolog" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - cluster/**/*
        - modules/**/*
