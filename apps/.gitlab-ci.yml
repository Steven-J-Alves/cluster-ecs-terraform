stages:
  - validate
  - plan
  - apply
  - destroy

#
image:
  name: hashicorp/terraform:light
  entrypoint:
    - '/usr/bin/env'
    - 'PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'

variables:
  # AWS_PROFILE: "${CI_COMMIT_BRANCH}-tf-crawler"
  DEPLOY_ENV: $CI_COMMIT_BRANCH

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        AWS_PROFILE: "kriolu-kloud-cluster"
        DEPLOY_ENV: "prod"
    - if: $CI_COMMIT_BRANCH == "homolog"
      variables:
        AWS_PROFILE: "kriolu-kloud-apps"
        DEPLOY_ENV: "homolog"
        
before_script:
  - echo "Starting Job and Check ENVs ..."
  - echo "DEPLOY_ENV=$DEPLOY_ENV"

  - echo "AWS_TERRAFORM_KEY_ID=$AWS_TERRAFORM_KEY_ID"
  - echo "AWS_TERRAFORM_SECRET=$AWS_TERRAFORM_SECRET"
  - echo "AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION"

  - echo "Configure AWS CLI ..."
  - aws configure set aws_access_key_id "$AWS_TERRAFORM_KEY_ID" --profile $AWS_PROFILE
  - aws configure set aws_secret_access_key "$AWS_TERRAFORM_SECRET" --profile $AWS_PROFILE
  - aws configure set region "$AWS_DEFAULT_REGION" --profile $AWS_PROFILE
  
  - echo "Go to Terraform Environment ..."
  - cd environments/$DEPLOY_ENV

  - echo "Shared State from S3 ..."
  - rm -rf .terraform

  - echo "Terraform INIT ..."
  - export TF_VAR_rds_db_password=$RDS_PASSWORD
  - terraform --version
  - terraform init

#
# ------- VALIDATE -------
validate:
  stage: validate
  script:
    - terraform validate
  environment:
    name: $DEPLOY_ENV
  tags:
    - runner-kriolu-kloud-shared
  only:
    # - dev
    # - staging
    - homolog
    - main

#
# ------- PLAN -------
plan:
  stage: plan
  script:
    - terraform plan
  dependencies:
    - validate
  environment:
    name: $DEPLOY_ENV
  tags:
    - runner-kriolu-kloud-shared
  only:
    # - dev
    # - staging
    - homolog
    - main


#
# ------- APPLY -------
apply:
  stage: apply
  script:
    - terraform apply -input=false -auto-approve
  allow_failure: false
  dependencies:
    - plan
  when: manual
  environment:
    name: $DEPLOY_ENV
  tags:
    - runner-kriolu-kloud-shared
  only:
    # - dev
    # - staging
    - homolog
    - main


#
# ------- DESTROY -------
destroy:
  stage: destroy
  script:
    - terraform destroy -input=false -auto-approve
  dependencies:
    - apply
  when: manual
  environment:
    name: $DEPLOY_ENV
  tags:
    - runner-kriolu-kloud-shared
  only:
    # - dev
    # - staging
    - homolog
    - main
