variables:
  TF_IMAGE: "hashicorp/terraform:1.9"
  # Mount the entire repo so relative module paths resolve correctly
  REPO_HOST_DIR: "$CI_PROJECT_DIR"
  APPS_TF_WORKDIR: "/workspace/apps/environments/prod"

stages:
  - validate
  - plan
  - apply
  - destroy

# ------- VALIDATE -------
apps:validate:
  stage: validate
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $APPS_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        -e TF_VAR_rds_db_password
        $TF_IMAGE init -input=false -reconfigure
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $APPS_TF_WORKDIR
        $TF_IMAGE validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - apps/**/*
        - modules/**/*

# ------- PLAN -------
apps:plan:
  stage: plan
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $APPS_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        -e TF_VAR_rds_db_password
        $TF_IMAGE init -input=false -reconfigure
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $APPS_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        -e TF_VAR_rds_db_password
        $TF_IMAGE plan -input=false -out=tfplan
  artifacts:
    paths:
      - apps/environments/prod/tfplan
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - apps/**/*
        - modules/**/*
  needs:
    - apps:validate

# ------- APPLY -------
apps:apply:
  stage: apply
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $APPS_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        -e TF_VAR_rds_db_password
        $TF_IMAGE init -input=false -reconfigure
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $APPS_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        -e TF_VAR_rds_db_password
        $TF_IMAGE apply -input=false -auto-approve
  when: manual
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - apps/**/*
        - modules/**/*
  needs:
    - apps:plan

# ------- DESTROY -------
apps:destroy:
  stage: destroy
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $APPS_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        -e TF_VAR_rds_db_password
        $TF_IMAGE init -input=false -reconfigure
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $APPS_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        -e TF_VAR_rds_db_password
        $TF_IMAGE destroy -input=false -auto-approve
  when: manual
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        - apps/**/*
        - modules/**/*
