# Apply order: network → cluster → apps
# Branches: main → prod | homolog → homolog
# apps2 is prod-only (no homolog environment yet).

variables:
  TF_IMAGE: "hashicorp/terraform:1.9"
  REPO_HOST_DIR: "$CI_PROJECT_DIR"

stages:
  - validate
  - plan
  - apply
  - destroy

# ── Job templates (hidden) ────────────────────────────────────────────────────

.apps_validate:
  stage: validate
  script:
    - if ! aws s3 ls "s3://kriolu-kloud-terraform-tfstates/cluster-terraform/${CLUSTER_STATE_ENV}/" --region us-east-1 > /dev/null 2>&1; then echo "ERROR - Cluster state not found. Run cluster:apply first."; exit 1; fi
    - echo "Cluster state found — OK"
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $APPS_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        -e TF_VAR_rds_db_password
        $TF_IMAGE init -input=false -reconfigure
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $APPS_TF_WORKDIR
        $TF_IMAGE validate

.apps_plan:
  stage: plan
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $APPS_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        -e TF_VAR_rds_db_password
        $TF_IMAGE init -input=false -reconfigure
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $APPS_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        -e TF_VAR_rds_db_password
        $TF_IMAGE plan -input=false -out=tfplan

.apps_apply:
  stage: apply
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $APPS_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        -e TF_VAR_rds_db_password
        $TF_IMAGE init -input=false -reconfigure
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $APPS_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        -e TF_VAR_rds_db_password
        $TF_IMAGE apply -input=false -auto-approve
  when: manual
  allow_failure: false

.apps_destroy:
  stage: destroy
  script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $APPS_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        -e TF_VAR_rds_db_password
        $TF_IMAGE init -input=false -reconfigure
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $APPS_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        -e TF_VAR_rds_db_password
        $TF_IMAGE destroy -input=false -auto-approve
  when: manual

# ── PROD — main branch ────────────────────────────────────────────────────────

apps:validate:
  extends: .apps_validate
  variables:
    APPS_TF_WORKDIR: "/workspace/apps/environments/prod"
    CLUSTER_STATE_ENV: "prod"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - apps/**/*
        - modules/**/*

apps:plan:
  extends: .apps_plan
  variables:
    APPS_TF_WORKDIR: "/workspace/apps/environments/prod"
  artifacts:
    paths:
      - apps/environments/prod/tfplan
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - apps/**/*
        - modules/**/*
  needs:
    - apps:validate

apps:apply:
  extends: .apps_apply
  variables:
    APPS_TF_WORKDIR: "/workspace/apps/environments/prod"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - apps/**/*
        - modules/**/*
  needs:
    - apps:plan

apps:destroy:
  extends: .apps_destroy
  variables:
    APPS_TF_WORKDIR: "/workspace/apps/environments/prod"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - apps/**/*
        - modules/**/*

# ── HOMOLOG — homolog branch ──────────────────────────────────────────────────

apps:homolog:validate:
  extends: .apps_validate
  variables:
    APPS_TF_WORKDIR: "/workspace/apps/environments/homolog"
    CLUSTER_STATE_ENV: "homolog"
  rules:
    - if: '$CI_COMMIT_BRANCH == "homolog" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - apps/**/*
        - modules/**/*

apps:homolog:plan:
  extends: .apps_plan
  variables:
    APPS_TF_WORKDIR: "/workspace/apps/environments/homolog"
  artifacts:
    paths:
      - apps/environments/homolog/tfplan
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "homolog" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - apps/**/*
        - modules/**/*
  needs:
    - apps:homolog:validate

apps:homolog:apply:
  extends: .apps_apply
  variables:
    APPS_TF_WORKDIR: "/workspace/apps/environments/homolog"
  before_script:
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $APPS_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE init -input=false -reconfigure
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $APPS_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE state rm 'module.homolog_app.aws_route53_record.app_front' || true
    - docker run --rm --user "$(id -u):$(id -g)"
        -v "$REPO_HOST_DIR:/workspace" -w $APPS_TF_WORKDIR
        -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY -e AWS_DEFAULT_REGION
        $TF_IMAGE state rm 'module.homolog_app.aws_route53_record.app_api' || true
  rules:
    - if: '$CI_COMMIT_BRANCH == "homolog" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - apps/**/*
        - modules/**/*
  needs:
    - apps:homolog:plan

apps:homolog:destroy:
  extends: .apps_destroy
  variables:
    APPS_TF_WORKDIR: "/workspace/apps/environments/homolog"
  rules:
    - if: '$CI_COMMIT_BRANCH == "homolog" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - apps/**/*
        - modules/**/*

